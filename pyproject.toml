[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jeffreykle-refusal_boundary_budget_alloc"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jeffreykle" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jeffreykle.github.io"
Repository = "https://github.com/jeffreykle/refusal_boundary_budget_alloc"
Issues = "https://github.com/jeffreykle/refusal_boundary_budget_alloc/issues"

[project.scripts]
refusal_boundary_budget_alloc = "refusal_boundary_budget_alloc:main"

[tool.setuptools]
py-modules = ["refusal_boundary_budget_alloc"]
